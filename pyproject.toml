[project]
authors = [{name = "Christopher Rivera", email = "chris.richard.rivera@gmail.com"}]
dependencies = []
name = "protein_epistasis"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
protein_epistasis = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.14.6,<3.15"
pandas = ">=3.0.5,<4"
seaborn = ">=0.13.2,<0.14"
statsmodels = ">=0.14.6,<0.15"
pip = ">=26.1.2,<27"
ipykernel = ">=7.3.0,<8"
jupyter = ">=1.1.1,<2"
itables = ">=2.9.1,<3"
jupyterlab = ">=4.6.2,<5"
ipywidgets = ">=8.1.8,<9"
scikit-learn = ">=1.9.0,<2"
plotly = ">=6.9.0,<7"
